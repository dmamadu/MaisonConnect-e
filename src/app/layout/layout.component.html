<app-header class="fixed top-0 left-0 w-full z-50"></app-header>

<main class="min-h-screen flex flex-col pt-[var(--header-height)]">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<!-- Bouton retour en haut -->
<button
  *ngIf="showScrollTop"
  (click)="scrollToTop()"
  class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full
         bg-[#0097A7] hover:bg-[#42B7C4] text-white shadow-xl
         transition-all duration-300 flex items-center justify-center
         hover:scale-110 animate-fade-in"
  aria-label="Retour en haut"
>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/>
  </svg>
</button>
