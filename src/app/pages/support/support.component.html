<!-- Fond dynamique -->
<div class="absolute inset-0 bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-950 dark:to-black -z-10"></div>

<section class="min-h-screen px-4 md:px-6 py-10 md:py-14 lg:py-20 relative flex flex-col items-center justify-center">

  <!-- HERO -->
  <header class="text-center mb-8 md:mb-12 lg:mb-16">
    <h1 class="page-title">
      {{ 'support.title' | translate }}
    </h1>
    <p class="page-subtitle mt-4">
      {{ 'support.subtitle' | translate }}
    </p>
  </header>

  <!-- GRID SUPPORT -->
  <section class="grid gap-5 md:gap-8 sm:grid-cols-2 lg:grid-cols-3 max-w-7xl w-full mx-auto mb-10 md:mb-16">
    <article *ngFor="let s of supportItems; let i = index"
             class="bg-white dark:bg-gray-900 rounded-2xl shadow-md dark:shadow-lg overflow-hidden flex flex-col transition transform hover:-translate-y-2 hover:scale-[1.02] opacity-0 animate-fade-up"
             [class.lg:col-start-2]="supportItems.length === 4 && i === 3"
             [style.animationDelay]="delayForIndex(i)">
      
      <!-- Image -->
      <div class="w-full h-48 bg-[#0097A7]/8 dark:bg-gray-800 flex items-center justify-center overflow-hidden relative">
        <img
          [src]="s.icon"
          [alt]="s.title"
          class="w-24 h-24 object-contain filter drop-shadow-lg"
          loading="lazy"
        />
      </div>

      <!-- Contenu centré -->
      <div class="p-6 flex flex-col items-center text-center flex-1">
        <h3 class="block-title mb-3">
          {{ s.title | translate }}
        </h3>
        <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed mb-4 flex-1">
          {{ s.description | translate }}
        </p>

        <a *ngIf="s.link"
           [routerLink]="s.link"
           class="mt-auto px-6 py-2 rounded-full bg-[#0097A7] hover:bg-[#42B7C4]
                  text-white font-medium transition-all duration-300">
          {{ 'support.buttons.access' | translate }}
        </a>
      </div>
    </article>
  </section>

  <!-- BOUTONS CONTACT RAPIDE : WhatsApp + Email -->
  <div class="max-w-3xl w-full mx-auto mb-8 md:mb-10 flex flex-col sm:flex-row gap-4 justify-center">
    <a href="https://wa.me/+221786722222"
       target="_blank" rel="noopener noreferrer"
       class="flex items-center justify-center gap-3 px-6 py-4 rounded-2xl
              bg-[#25D366] hover:bg-[#1ebe5d] text-white font-semibold text-base
              shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-[1.02]">
      <svg class="w-6 h-6 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Discuter sur WhatsApp
    </a>

    <a href="mailto:admin@maison-connecte.sn"
       class="flex items-center justify-center gap-3 px-6 py-4 rounded-2xl
              bg-white dark:bg-gray-800 border-2 border-[#0097A7]
              text-[#0097A7] dark:text-[#42B7C4] font-semibold text-base
              shadow-lg hover:shadow-xl hover:bg-[#0097A7] hover:text-white dark:hover:bg-[#0097A7] dark:hover:text-white
              transition-all duration-300 transform hover:scale-[1.02]">
      <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      Envoyer un email
    </a>
  </div>

  <!-- FORMULAIRE CONTACT RAPIDE -->
  <div class="max-w-3xl w-full mx-auto p-5 md:p-8 bg-white dark:bg-gray-900 rounded-2xl shadow-xl dark:shadow-2xl border border-gray-200 dark:border-gray-800">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-12 h-12 bg-[#0097A7] rounded-full flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <h2 class="section-title">
        {{ 'support.form.title' | translate }}
      </h2>
    </div>
    
    <form (submit)="submitForm()">
      <div class="grid gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            {{ 'support.form.name' | translate }}
          </label>
          <input type="text" placeholder="{{ 'support.form.name_placeholder' | translate }}" [(ngModel)]="form.name" name="name" required
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-[#0097A7] focus:border-[#0097A7] focus:outline-none transition" />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            {{ 'support.form.email' | translate }}
          </label>
          <input type="email" placeholder="{{ 'support.form.email_placeholder' | translate }}" [(ngModel)]="form.email" name="email" required
                 class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-[#0097A7] focus:border-[#0097A7] focus:outline-none transition" />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
            {{ 'support.form.message' | translate }}
          </label>
          <textarea placeholder="{{ 'support.form.message_placeholder' | translate }}" [(ngModel)]="form.message" name="message" rows="5" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-[#0097A7] focus:border-[#0097A7] focus:outline-none transition resize-none"></textarea>
        </div>
        
        <button type="submit"
                class="w-full px-6 py-3 rounded-lg bg-[#0097A7] hover:bg-[#42B7C4] text-white transition-all duration-300 font-semibold shadow-lg hover:shadow-xl transform hover:scale-[1.02]">
          <span class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            {{ 'support.form.submit' | translate }}
          </span>
        </button>
      </div>
    </form>
  </div>

</section>

<!-- ANIMATIONS CSS -->
<style>
  @keyframes fade-up {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-up {
    animation: fade-up 0.5s ease forwards;
  }

  article:hover img {
    transform: scale(1.1) rotate(5deg);
    transition: transform 0.3s ease;
  }
</style>
